<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - EVA THE RHINO</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121110;
      --card-bg: #1c1a19;
      --text-main: #f4f4f4;
      --text-muted: #888;
      --accent: #e83a42;
      --accent-hover: #ff4a52;
      --border: #2a2826;
      --input-bg: #121110;
    }
    body { 
      font-family: 'Prompt', sans-serif; 
      background: var(--bg-color); 
      color: var(--text-main);
      padding: 20px; 
      margin: 0;
    }
    .container { 
      max-width: 900px; 
      margin: 0 auto; 
      background: var(--card-bg); 
      padding: 40px; 
      border-radius: 12px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      border: 1px solid var(--border);
    }
    h1 { color: #fff; font-size: 28px; margin-top: 0; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 30px;}
    h2 { color: #fff; font-size: 18px; margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    h2::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--accent); border-radius: 2px;}
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
    
    input[type="text"], input[type="password"], textarea { 
      width: 100%; 
      padding: 12px 15px; 
      background: var(--input-bg);
      border: 1px solid var(--border); 
      border-radius: 6px; 
      box-sizing: border-box; 
      color: #fff;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 58, 66, 0.15);
    }
    textarea { height: 100px; resize: vertical; }
    
    .section-card { 
      border: 1px solid var(--border); 
      padding: 25px; 
      margin-bottom: 25px; 
      border-radius: 10px; 
      background: rgba(255,255,255,0.02); 
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .section-card:hover {
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      border-color: #3a3836;
    }
    
    .btn { 
      background: var(--accent); 
      color: #fff; 
      border: none; 
      padding: 12px 24px; 
      font-size: 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      letter-spacing: 0.5px;
      transition: background 0.3s, transform 0.1s; 
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    
    .btn-save {
      position: sticky; 
      top: 20px; 
      float: right; 
      z-index: 100;
      box-shadow: 0 4px 15px rgba(232, 58, 66, 0.3);
    }

    /* Unsaved changes indicator */
    .btn-save.has-changes {
      animation: pulseGlow 2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 4px 15px rgba(232, 58, 66, 0.3); }
      50% { box-shadow: 0 4px 25px rgba(232, 58, 66, 0.6); }
    }
    
    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 200px; }
    
    #login-section { text-align: center; margin-top: 100px; max-width: 400px; }
    #admin-section { display: none; }
    
    /* Dynamic lists like Top Perf and Rate Card */
    .list-item { 
      border: 1px solid var(--border); 
      padding: 20px; 
      margin-bottom: 15px; 
      position: relative; 
      border-radius: 8px;
      background: var(--bg-color);
    }
    .remove-btn { 
      position: absolute; 
      top: 15px; 
      right: 15px; 
      background: transparent; 
      color: var(--text-muted); 
      border: 1px solid var(--border); 
      padding: 5px 10px; 
      cursor: pointer; 
      border-radius: 4px; 
      font-size: 12px;
      transition: all 0.2s;
    }
    .remove-btn:hover { background: #ff4444; color: #fff; border-color: #ff4444; }
    
    hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
    
    /* Toast Notifications */
    #toast-container {
      position: fixed;
      bottom: 80px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: var(--card-bg);
      color: #fff;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-left: 4px solid var(--accent);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      opacity: 0;
      transform: translateX(100%);
    }
    .toast.success { border-left-color: #4cd137; }
    .toast.error { border-left-color: #e84118; }
    .toast.fade-out {
      animation: fadeOut 0.3s ease forwards;
    }
    
    @keyframes slideIn {
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateY(20px); }
    }
    
    /* Home Button */
    .btn-home {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.3s;
      z-index: 1000;
    }
    .btn-home:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-5px);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container { padding: 20px; }
      .row { flex-direction: column; gap: 10px; }
      .col { min-width: 100%; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <!-- Home Button -->
  <a href="index.html" class="btn-home" title="Back to Home">🏠</a>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <div class="container" id="login-section">
    <h1>Admin Access</h1>
    <div class="form-group" style="margin: 0 auto 20px auto;">
      <input type="password" id="password" placeholder="Enter Password" onkeypress="if(event.key === 'Enter') login()">
    </div>
    <button class="btn" onclick="login()" style="width: 100;">Login</button>
  </div>

  <div class="container" id="admin-section">
    <button class="btn btn-save" id="saveBtn" onclick="saveData()">💾 Save All Changes</button>
    <h1>Media Kit Dashboard</h1>

    <form id="admin-form">
      <!-- General -->
      <div class="section-card">
        <h2>1. General Info</h2>
        <div class="form-group"><label>Name</label><input type="text" id="general.name"></div>
        <div class="form-group"><label>Tagline</label><input type="text" id="general.tagline"></div>
        <div class="form-group"><label>Window</label><input type="text" id="general.window"></div>
        <div class="form-group"><label>Bio</label><textarea id="general.bio"></textarea></div>
        <hr style="margin:20px 0;">
        <div class="row">
          <div class="col"><label>TikTok Handle</label><input type="text" id="general.tiktokHandle"></div>
          <div class="col"><label>TikTok URL</label><input type="text" id="general.tiktokUrl"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>YouTube Handle</label><input type="text" id="general.youtubeHandle"></div>
          <div class="col"><label>YouTube URL</label><input type="text" id="general.youtubeUrl"></div>
        </div>
      </div>

      <!-- Overview Stats -->
      <div class="section-card">
        <h2>2. Overview Stats</h2>
        <div class="row">
          <div class="col"><label>Total Followers</label><input type="text" id="overview.totalFollowers"></div>
          <div class="col"><label>Followers Growth</label><input type="text" id="overview.totalFollowersGrowth"></div>
          <div class="col"><label>Views</label><input type="text" id="overview.views"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>Engagement</label><input type="text" id="overview.engagement"></div>
          <div class="col"><label>Watch Time</label><input type="text" id="overview.watchTime"></div>
        </div>
      </div>

      <!-- TikTok Stats -->
      <div class="section-card">
        <h2>3. TikTok Stats</h2>
        <div class="row">
          <div class="col"><label>Followers</label><input type="text" id="tiktokStats.followers"></div>
          <div class="col"><label>Video Views</label><input type="text" id="tiktokStats.videoViews"></div>
          <div class="col"><label>Total Viewers</label><input type="text" id="tiktokStats.totalViewers"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>Likes</label><input type="text" id="tiktokStats.likes"></div>
          <div class="col"><label>Shares</label><input type="text" id="tiktokStats.shares"></div>
          <div class="col"><label>Profile Views</label><input type="text" id="tiktokStats.profileViews"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>Male %</label><input type="text" id="tiktokStats.male"></div>
          <div class="col"><label>Female %</label><input type="text" id="tiktokStats.female"></div>
          <div class="col"><label>Thai %</label><input type="text" id="tiktokStats.thai"></div>
        </div>
      </div>

      <!-- YouTube Stats -->
      <div class="section-card">
        <h2>4. YouTube Stats</h2>
        <div class="row">
          <div class="col"><label>Views</label><input type="text" id="youtubeStats.views"></div>
          <div class="col"><label>Impressions</label><input type="text" id="youtubeStats.impressions"></div>
          <div class="col"><label>CTR</label><input type="text" id="youtubeStats.ctr"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>Watch Hrs</label><input type="text" id="youtubeStats.watchHrs"></div>
          <div class="col"><label>Avg View</label><input type="text" id="youtubeStats.avgView"></div>
          <div class="col"><label>From Shorts %</label><input type="text" id="youtubeStats.fromShorts"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>Male %</label><input type="text" id="youtubeStats.male"></div>
          <div class="col"><label>Female %</label><input type="text" id="youtubeStats.female"></div>
        </div>
      </div>

      <!-- Age Stats & Demographics Details -->
      <div class="section-card">
        <h2>4.1 Age & Location & Growth</h2>
        <div class="row">
          <div class="col"><label>Age 25-34 %</label><input type="text" id="ageStats.age2534"></div>
          <div class="col"><label>Age 35-44 %</label><input type="text" id="ageStats.age3544"></div>
          <div class="col"><label>Age 18-24 %</label><input type="text" id="ageStats.age1824"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>Age 45-54 %</label><input type="text" id="ageStats.age4554"></div>
          <div class="col"><label>Age 13-17 %</label><input type="text" id="ageStats.age1317"></div>
        </div>
        <hr style="margin:20px 0;">
        <div class="row">
          <div class="col"><label>Location Main %</label><input type="text" id="location.mainPercent"></div>
          <div class="col"><label>Location Main Country</label><input type="text" id="location.mainCountry"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col"><label>Location Others</label><input type="text" id="location.others"></div>
        </div>
        <hr style="margin:20px 0;">
        <div class="row">
          <div class="col"><label>Growth Start</label><input type="text" id="growthChart.start"></div>
          <div class="col"><label>Growth End</label><input type="text" id="growthChart.end"></div>
          <div class="col"><label>Growth Diff</label><input type="text" id="growthChart.diff"></div>
        </div>
        <hr style="margin:20px 0;">
        <div class="row">
          <div class="col"><label>Peak Start Hour</label><input type="text" id="activeHours.peakStart"></div>
          <div class="col"><label>Peak End Hour</label><input type="text" id="activeHours.peakEnd"></div>
        </div>
      </div>

      <!-- Top Performance -->
      <div class="section-card">
        <h2>5. Top Performance (Top 3)</h2>
        <div id="top-perf-container"></div>
      </div>

      <!-- Rate Card -->
      <div class="section-card">
        <h2>6. Rate Card</h2>
        <div id="rate-card-container"></div>
      </div>

      <!-- Terms & Booking -->
      <div class="section-card">
        <h2>7. Terms & Booking Contact</h2>
        <div class="form-group"><label>Terms (one per line)</label><textarea id="termsBooking.terms" style="height:120px;"></textarea></div>
        <hr style="margin:20px 0;">
        <div class="row">
          <div class="col"><label>Booking Email</label><input type="text" id="termsBooking.email"></div>
          <div class="col"><label>Booking Discord</label><input type="text" id="termsBooking.discord"></div>
        </div>
      </div>

    </form>
  </div>

  <script src="admin.js"></script>
</body>
</html>
